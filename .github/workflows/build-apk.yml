name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Arrange project files
        run: |
          mkdir -p www/fonts scripts
          cp index.html www/index.html
          cp fonts.css www/fonts/fonts.css
          cp bundle-assets.js scripts/bundle-assets.js

      - name: Install packages
        run: npm install

      - name: Bundle three.js and fonts for offline play
        run: npm run bundle

      - name: Create Android project
        run: |
          npx cap add android
          npx cap sync android

      - name: Full-screen activity and shared signing key
        run: |
          cp MainActivity.java android/app/src/main/java/com/themancam/pulserider/MainActivity.java
          mkdir -p ~/.android
          cp debug.keystore ~/.android/debug.keystore

      - name: Build APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: pulse-rider-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish to the latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk pulse-rider.apk
          gh release delete latest --yes --cleanup-tag || true
          gh release create latest pulse-rider.apk --title "Pulse Rider (latest build)" --notes "Built from ${GITHUB_SHA::7}" --prerelease
